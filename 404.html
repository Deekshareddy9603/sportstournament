<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Stalin Sports Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
        --sports-neon: #00ff66;
        --sports-neon-glow: rgba(0, 255, 102, 0.35);
        --obsidian-dark: #0a0a0a;
        --obsidian-card: #141414;
        --pure-black: #000000;
        --text-light: #f5f5f5;
        --text-muted: #a3a3a3;
        --border-color: rgba(0, 255, 102, 0.2);
        --font-heading: 'Montserrat', sans-serif;
        --font-body: 'Plus Jakarta Sans', sans-serif;
        --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--obsidian-dark);
        color: var(--text-light);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    /* Ambient Glow Background Effect */
    body::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(0, 255, 102, 0.08) 0%, rgba(10, 10, 10, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
    }

    .error-container {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 2.5rem;
        max-width: 600px;
        width: 90%;
        background: var(--obsidian-card);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 102, 0.1);
        backdrop-filter: blur(20px);
    }

    .error-icon-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        background: var(--pure-black);
        border: 1px solid var(--sports-neon);
        border-radius: 50%;
        color: var(--sports-neon);
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 0 20px var(--sports-neon-glow);
    }

    /* Bold 404 Number with Attractive Gradient & Glow */
    .error-code {
        font-family: var(--font-heading);
        font-size: clamp(5rem, 15vw, 8rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffffff 30%, var(--sports-neon) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 40px var(--sports-neon-glow);
        margin-bottom: 0.5rem;
    }

    .error-title {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--text-light);
        margin-bottom: 1rem;
        letter-spacing: -0.5px;
    }

    .error-description {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
    }

    .error-action-group {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-error {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.8rem 1.6rem;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: var(--transition);
        cursor: pointer;
    }

    .btn-go-back {
        background: var(--pure-black);
        border: 1px solid var(--border-color);
        color: var(--text-light);
    }

    .btn-go-back:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--text-light);
        transform: translateY(-2px);
    }

    .btn-go-home {
        background: linear-gradient(135deg, var(--sports-neon), #00cc52);
        border: 1px solid var(--sports-neon);
        color: var(--pure-black);
        box-shadow: 0 4px 20px var(--sports-neon-glow);
    }

    .btn-go-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 255, 102, 0.5);
    }

    @media (max-width: 480px) {
        .error-action-group {
            flex-direction: column;
        }
        .btn-error {
            width: 100%;
            justify-content: center;
        }
    }
  </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon-badge">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        
        <div class="error-code">404</div>
        
        <h2 class="error-title">Page Out of Bounds</h2>
        <p class="error-description">
            The referee blew the whistle! The page or tournament resource you are looking for has been moved, deleted, or never existed on the pitch.
        </p>

        <div class="error-action-group">
            <button onclick="history.back()" class="btn-error btn-go-back">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>
            <a href="index.html" class="btn-error btn-go-home">
                <i class="fa-solid fa-house"></i> Go Home Page
            </a>
        </div>
    </div>

</body>
</html>
